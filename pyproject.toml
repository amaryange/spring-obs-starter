[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spring-obs-starter"
version = "1.0.0"
description = "One-command generator for Spring Boot 4 projects with production-ready OTel observability"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["spring-boot", "opentelemetry", "observability", "grafana", "generator"]
dependencies = [
    "click>=8.1",
    "questionary>=2.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sb-obs = "cli.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
artifacts = ["templates/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
