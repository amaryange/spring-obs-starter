name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── 0. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short

  # ── 1. CLI binaries (cross-platform) ────────────────────────────────────────
  build-cli:
    name: Build CLI — ${{ matrix.os }} / ${{ matrix.arch }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            asset: sos-linux-x86_64

          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            asset: sos-linux-arm64

          - os: macos
            arch: x86_64
            runner: macos-13
            asset: sos-macos-x86_64

          - os: macos
            arch: arm64
            runner: macos-14
            asset: sos-macos-arm64

          - os: windows
            arch: x86_64
            runner: windows-2022
            asset: sos-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --name sos
          --add-data "templates${{ matrix.os == 'windows' && ';' || ':' }}templates"
          cli/generate.py

      - name: Rename binary (Unix)
        if: matrix.os != 'windows'
        run: mv dist/sos dist/${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows'
        run: mv dist/sos.exe dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # ── 2. Pre-built obs-stack archives ─────────────────────────────────────────
  build-obs-stacks:
    name: Build obs-stack archives
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Generate obs-stack archives
        run: python scripts/build_obs_stacks.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-stacks
          path: dist/obs-stacks/*.tar.gz

  # ── 3. GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-cli, build-obs-stacks]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sos-*
          path: dist/cli/
          merge-multiple: true

      - name: Download obs-stack artifacts
        uses: actions/download-artifact@v4
        with:
          name: obs-stacks
          path: dist/obs-stacks/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "sos ${{ github.ref_name }}"
          body: |
            ## Install the CLI

            ```bash
            curl -fsSL https://raw.githubusercontent.com/amaryange/spring-obs-starter/main/install.sh | bash
            ```

            Or download the binary for your platform below and add it to your `PATH`.

            ## Pre-built observability stacks

            Ready-to-use obs stacks for multi-service setups — no generator needed:

            | Archive | Backends |
            |---------|----------|
            | `obs-stack-tempo-prometheus.tar.gz` | Tempo + Prometheus *(recommended)* |
            | `obs-stack-tempo-mimir.tar.gz` | Tempo + Mimir |
            | `obs-stack-jaeger-prometheus.tar.gz` | Jaeger + Prometheus |
            | `obs-stack-zipkin-prometheus.tar.gz` | Zipkin + Prometheus |

            ```bash
            tar xzf obs-stack-tempo-prometheus.tar.gz
            cd obs-stack-tempo-prometheus && docker compose up -d
            ```
          files: |
            dist/cli/*
            dist/obs-stacks/*
          generate_release_notes: true