name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            asset: sbo-linux-x86_64

          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            asset: sbo-linux-arm64

          - os: macos
            arch: x86_64
            runner: macos-13
            asset: sbo-macos-x86_64

          - os: macos
            arch: arm64
            runner: macos-14
            asset: sbo-macos-arm64

          - os: windows
            arch: x86_64
            runner: windows-2022
            asset: sbo-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --name sbo
          --add-data "templates${{ matrix.os == 'windows' && ';' || ':' }}templates"
          cli/generate.py

      - name: Rename binary (Unix)
        if: matrix.os != 'windows'
        run: mv dist/sbo dist/${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows'
        run: mv dist/sbo.exe dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "sbo ${{ github.ref_name }}"
          body: |
            ## Installation

            ```bash
            curl -fsSL https://raw.githubusercontent.com/amaryange/spring-obs-starter/main/install.sh | bash
            ```

            Or download the binary for your platform below and add it to your `PATH`.

            ## Checksums
          files: dist/**/*
          generate_release_notes: true
