extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # --- Traces ---

  # Tempo (recommandé)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Jaeger (option ou combinaison Tempo+Jaeger)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Zipkin (option)
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans

  # --- Métriques ---

  # Prometheus (remote_write)
  prometheusremotewrite/prometheus:
    endpoint: http://prometheus:9090/api/v1/write

  # Mimir (remote_write)
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: "dev"

  # --- Logs ---

  # Loki (OTLP natif — Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # --- Debug (dev only) ---
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, debug]
